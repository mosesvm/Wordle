<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #121213;
    --tile-border: #3a3a3c;
    --tile-empty: #121213;
    --correct: #538d4e;
    --present: #b59f3b;
    --absent: #3a3a3c;
    --key-bg: #818384;
    --key-text: #fff;
    --text: #fff;
    --header-border: #3a3a3c;
    --toast-bg: #fff;
    --toast-text: #000;
    --modal-bg: #1a1a1b;
    --modal-border: #3a3a3c;
    --divider: #3a3a3c;
    --muted: #818384;
    --filled-border: #565758;
    --surface-hover: rgba(255,255,255,0.06);
    --overlay: rgba(0,0,0,0.72);
  }

  /* Light theme */
  html.light {
    --bg: #ffffff;
    --tile-border: #d3d6da;
    --tile-empty: #ffffff;
    --absent: #787c7e;
    --key-bg: #d3d6da;
    --key-text: #000;
    --text: #1a1a1b;
    --header-border: #d3d6da;
    --toast-bg: #1a1a1b;
    --toast-text: #ffffff;
    --modal-bg: #ffffff;
    --modal-border: #d3d6da;
    --divider: #d3d6da;
    --muted: #787c7e;
    --filled-border: #878a8c;
    --surface-hover: rgba(0,0,0,0.06);
    --overlay: rgba(0,0,0,0.55);
  }

  /* Color-blind mode: orange = correct, blue = present */
  html.colorblind {
    --correct: #f5793a;
    --present: #85c0f9;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    user-select: none;
    transition: background 0.25s, color 0.25s;
  }

  header {
    width: 100%;
    max-width: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--header-border);
    padding: 12px 16px;
    position: relative;
  }

  header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.15rem;
    text-transform: uppercase;
  }

  /* Shared header button style */
  .hdr-btn {
    position: absolute;
    background: none;
    border: 1px solid var(--filled-border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    padding: 5px 8px;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06rem;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }

  .hdr-btn svg { flex-shrink: 0; }
  .hdr-btn:hover { border-color: var(--muted); color: var(--text); }

  #theme-toggle { left: 16px; }
  #cb-toggle    { right: 16px; }

  #cb-toggle.active {
    border-color: var(--correct);
    color: var(--correct);
    background: rgba(245,121,58,0.08);
  }

  html.colorblind #cb-toggle.active { background: rgba(133,192,249,0.08); }

  /* ── Toasts ─────────────────────────────────────────────────────────── */
  #toast-container {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }

  .toast {
    background: var(--toast-bg);
    color: var(--toast-text);
    padding: 10px 16px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.9rem;
    animation: fadeInOut 1.8s ease forwards;
  }

  @keyframes fadeInOut {
    0%   { opacity: 0; transform: translateY(-6px); }
    15%  { opacity: 1; transform: translateY(0); }
    70%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ── Board ──────────────────────────────────────────────────────────── */
  #board-container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-grow: 1;
    padding: 20px 0 10px;
  }

  #board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 5px;
    width: 350px;
    height: 420px;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }

  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 700;
    text-transform: uppercase;
    border: 2px solid var(--tile-border);
    background: var(--tile-empty);
    color: var(--text);
    transition: border-color 0.05s;
    perspective: 250px;
  }

  .tile[data-letter] {
    border-color: var(--filled-border);
    animation: pop 0.1s ease;
  }

  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  /* Flip uses a wrapper trick so the color swap happens at the midpoint */
  .tile.flipping {
    animation: flip 0.5s ease forwards;
  }

  @keyframes flip {
    0%   { transform: rotateX(0deg); }
    49%  { transform: rotateX(-90deg); }
    50%  { transform: rotateX(-90deg); }
    100% { transform: rotateX(0deg); }
  }

  .tile.correct { background: var(--correct); border-color: var(--correct); color: #fff; }
  .tile.present { background: var(--present); border-color: var(--present); color: #fff; }
  .tile.absent  { background: var(--absent);  border-color: var(--absent);  color: #fff; }

  .tile.shake {
    animation: shake 0.5s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-4px); }
    40%      { transform: translateX(4px); }
    60%      { transform: translateX(-4px); }
    80%      { transform: translateX(4px); }
  }

  .tile.bounce {
    animation: bounce 0.5s ease forwards;
  }

  @keyframes bounce {
    0%   { transform: translateY(0); }
    40%  { transform: translateY(-20px); }
    60%  { transform: translateY(-10px); }
    80%  { transform: translateY(-16px); }
    100% { transform: translateY(0); }
  }

  /* ── Keyboard ───────────────────────────────────────────────────────── */
  #keyboard {
    width: 100%;
    max-width: 500px;
    padding: 0 8px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .kb-row {
    display: flex;
    justify-content: center;
    gap: 6px;
  }

  .key {
    height: 58px;
    min-width: 43px;
    border-radius: 4px;
    border: none;
    background: var(--key-bg);
    color: var(--key-text);
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    max-width: 43px;
    transition: background 0.2s, color 0.2s;
  }

  .key.wide { min-width: 65px; max-width: 65px; font-size: 0.75rem; }
  .key.correct { background: var(--correct); color: #fff; }
  .key.present { background: var(--present); color: #fff; }
  .key.absent  { background: var(--absent);  color: #fff; }

  /* ── Modal ──────────────────────────────────────────────────────────── */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: 150;
    align-items: center;
    justify-content: center;
    transition: background 0.25s;
  }

  #modal-overlay.visible { display: flex; }

  #modal {
    background: var(--modal-bg);
    border: 1px solid var(--modal-border);
    border-radius: 12px;
    padding: 28px 32px 24px;
    width: min(400px, 92vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    animation: modalIn 0.25s ease;
  }

  @keyframes modalIn {
    from { transform: scale(0.88); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }

  #modal-title {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.12rem;
    text-transform: uppercase;
    color: var(--muted);
  }

  #modal-headline {
    font-size: 1.6rem;
    font-weight: 700;
    text-align: center;
    line-height: 1.2;
  }

  #modal-answer {
    font-size: 1rem;
    color: var(--muted);
    text-align: center;
  }

  #modal-answer span {
    color: var(--text);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1rem;
  }

  #modal-divider {
    width: 100%;
    height: 1px;
    background: var(--divider);
  }

  /* Stats row */
  #modal-stats {
    display: flex;
    gap: 16px;
    justify-content: center;
    width: 100%;
  }

  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
  }

  .stat-num {
    font-size: 2rem;
    font-weight: 700;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.04rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.3;
  }

  /* Guess distribution */
  #modal-dist {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  #modal-dist h3 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1rem;
    color: var(--muted);
    margin-bottom: 4px;
    text-align: center;
  }

  .dist-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
  }

  .dist-label {
    width: 12px;
    text-align: right;
    font-weight: 700;
    flex-shrink: 0;
  }

  .dist-bar-wrap {
    flex: 1;
    height: 20px;
    background: transparent;
  }

  .dist-bar {
    height: 100%;
    background: var(--absent);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 6px;
    font-size: 0.78rem;
    font-weight: 700;
    color: #fff;
    min-width: 20px;
    border-radius: 2px;
    transition: width 0.6s ease;
  }

  .dist-bar.highlight { background: var(--correct); }

  /* Modal action buttons */
  #modal-actions {
    display: flex;
    gap: 10px;
    width: 100%;
    margin-top: 4px;
  }

  #share-btn, #play-again-btn {
    flex: 1;
    padding: 14px 0;
    border-radius: 4px;
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06rem;
    cursor: pointer;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  #share-btn {
    background: transparent;
    border: 2px solid var(--filled-border);
    color: var(--text);
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }

  #share-btn:hover { border-color: var(--muted); background: var(--surface-hover); }

  #share-btn.copied {
    border-color: var(--correct);
    color: var(--correct);
  }

  #play-again-btn {
    background: var(--correct);
    color: #fff;
  }

  #play-again-btn:hover { filter: brightness(1.15); }
</style>
</head>

</div>

  "stunt","suave","sulky","swamp","swear","sweat","swept","swipe","swirl","sword",
  // T
  "tabby","talon","tangy","taunt","tawny","terse","thick","thief","thorn","threw",
  "tiara","token","topaz","torch","toxic","trace","track","trade","trail","trait",
  "tramp","trash","trawl","tread","trend","trick","tribe","troll","trout","trove",
  "truce","truly","trunk","tuber","tulip","tuner","twang","tweak","twirl",
  // U
  "ulcer","ultra","umbra","uncut","unfit","union","unite","unlit","until","upper",
  "upset","urban","usher","utter",
  // V
  "vague","vapid","vault","vegan","verge","verse","vigor","viola","viper",
  // W
  "waltz","waste","weigh","weird","whale","whack","whiff","whirl","whisk","wield",
  "witch","witty","wonky","wordy","worth","wrath","wrist","wrong",
  // Y–Z
  "yeast","yearn","yield","young","zesty","zippy"
];

const ALL_VALID = new Set([...WORDS, ...VALID_EXTRA]);

// ─── Stats (localStorage) ─────────────────────────────────────────────────────
const STATS_KEY = "wordle_stats";

function loadStats() {
  try {
    const raw = localStorage.getItem(STATS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (_) {}
  return { played: 0, won: 0, streak: 0, maxStreak: 0, distribution: [0,0,0,0,0,0] };
}

function saveStats(s) {
  try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch (_) {}
}

function recordResult(won, guessCount) {
  const s = loadStats();
  s.played++;
  if (won) {
    s.won++;
    s.streak++;
    if (s.streak > s.maxStreak) s.maxStreak = s.streak;
    s.distribution[guessCount - 1]++;
  } else {
    s.streak = 0;
  }
  saveStats(s);
  return s;
}

// ─── Game state ───────────────────────────────────────────────────────────────
let target, guesses, results, currentRow, currentCol, gameOver;

function initGame() {
  target = WORDS[Math.floor(Math.random() * WORDS.length)].toUpperCase();
  guesses = Array.from({ length: 6 }, () => Array(5).fill(""));
  results = [];
  currentRow = 0;
  currentCol = 0;
  gameOver = false;
  closeModal();
  renderBoard();
  renderKeyboard();
}

// ─── Board ────────────────────────────────────────────────────────────────────
function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  for (let r = 0; r < 6; r++) {
    const row = document.createElement("div");
    row.className = "row";
    row.id = `row-${r}`;
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.id = `tile-${r}-${c}`;
      row.appendChild(tile);
    }
    board.appendChild(row);
  }
}

function getTile(r, c) { return document.getElementById(`tile-${r}-${c}`); }

function setTileLetter(r, c, letter) {
  const tile = getTile(r, c);
  tile.textContent = letter;
  if (letter) tile.dataset.letter = letter;
  else delete tile.dataset.letter;
}

// ─── Keyboard ─────────────────────────────────────────────────────────────────
const KB_ROWS = [
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L"],
  ["ENTER","Z","X","C","V","B","N","M","⌫"]
];

function renderKeyboard() {
  KB_ROWS.forEach((keys, i) => {
    const row = document.getElementById(`kb-row-${i + 1}`);
    row.innerHTML = "";
    keys.forEach(k => {
      const btn = document.createElement("button");
      btn.className = "key" + (k === "ENTER" || k === "⌫" ? " wide" : "");
      btn.textContent = k;
      btn.dataset.key = k;
      btn.addEventListener("click", () => handleKey(k));
      row.appendChild(btn);
    });
  });
}

function updateKeyColor(letter, state) {
  const priority = { correct: 3, present: 2, absent: 1 };
  document.querySelectorAll(`.key[data-key="${letter}"]`).forEach(btn => {
    const current = btn.classList.contains("correct") ? "correct"
                  : btn.classList.contains("present") ? "present"
                  : btn.classList.contains("absent")  ? "absent" : null;
    if (!current || priority[state] > priority[current]) {
      btn.classList.remove("correct", "present", "absent");
      btn.classList.add(state);
    }
  });
}

// ─── Input ────────────────────────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === "Enter")     handleKey("ENTER");
  else if (e.key === "Backspace") handleKey("⌫");
  else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
});

function handleKey(key) {
  if (gameOver) return;
  if (key === "⌫") {
    if (currentCol > 0) {
      currentCol--;
      guesses[currentRow][currentCol] = "";
      setTileLetter(currentRow, currentCol, "");
    }
    return;
  }
  if (key === "ENTER") { submitGuess(); return; }
  if (currentCol < 5 && /^[A-Z]$/.test(key)) {
    guesses[currentRow][currentCol] = key;
    setTileLetter(currentRow, currentCol, key);
    currentCol++;
  }
}

// ─── Evaluation ───────────────────────────────────────────────────────────────
function evaluate(guess, answer) {
  const result = Array(5).fill("absent");
  const ansArr = answer.split("");
  const used   = Array(5).fill(false);

  for (let i = 0; i < 5; i++) {
    if (guess[i] === ansArr[i]) { result[i] = "correct"; used[i] = true; }
  }
  for (let i = 0; i < 5; i++) {
    if (result[i] === "correct") continue;
    for (let j = 0; j < 5; j++) {
      if (!used[j] && guess[i] === ansArr[j]) {
        result[i] = "present"; used[j] = true; break;
      }
    }
  }
  return result;
}

// ─── Submit ───────────────────────────────────────────────────────────────────
function submitGuess() {
  if (currentCol < 5) { shakeRow(currentRow); showToast("Not enough letters"); return; }

  const word = guesses[currentRow].join("");
  if (!ALL_VALID.has(word.toLowerCase())) {
    shakeRow(currentRow); showToast("Not in word list"); return;
  }

  const result = evaluate(word, target);
  results.push(result);
  const row    = currentRow; // capture before async

  // Staggered flip: 100ms between tiles, each flip takes 500ms
  for (let c = 0; c < 5; c++) {
    const tile  = getTile(row, c);
    const delay = c * 100;
    setTimeout(() => {
      tile.classList.add("flipping");
      // Swap color at midpoint (250ms into the 500ms flip)
      setTimeout(() => {
        tile.classList.add(result[c]);
        updateKeyColor(guesses[row][c], result[c]);
      }, 250);
      setTimeout(() => tile.classList.remove("flipping"), 500);
    }, delay);
  }

  // After last tile finishes: (4 * 100) + 500 = 900ms
  const TOTAL = 4 * 100 + 500;

  setTimeout(() => {
    const won = result.every(r => r === "correct");
    if (won) {
      gameOver = true;
      const msgs = ["Genius!","Magnificent!","Impressive!","Splendid!","Great!","Phew!"];
      showToast(msgs[row] || "Nice!");
      bounceRow(row);
      const stats = recordResult(true, row + 1);
      setTimeout(() => openModal(true, row + 1, stats), 1600);
    } else if (row === 5) {
      gameOver = true;
      const stats = recordResult(false, 0);
      setTimeout(() => openModal(false, 0, stats), 800);
    } else {
      currentRow++;
      currentCol = 0;
    }
  }, TOTAL + 50);
}

// ─── Modal ────────────────────────────────────────────────────────────────────
function openModal(won, guessCount, stats) {
  document.getElementById("modal-headline").textContent =
    won ? (guessCount === 1 ? "Hole in one!" :
           guessCount <= 3  ? "Impressive!" : "You got it!") :
         "Better luck next time";

  const answerEl = document.getElementById("modal-answer");
  answerEl.innerHTML = won
    ? `Solved in <span>${guessCount}</span> ${guessCount === 1 ? "guess" : "guesses"}`
    : `The word was <span>${target}</span>`;

  document.getElementById("stat-played").textContent    = stats.played;
  document.getElementById("stat-winpct").textContent    = stats.played
    ? Math.round((stats.won / stats.played) * 100) : 0;
  document.getElementById("stat-streak").textContent    = stats.streak;
  document.getElementById("stat-maxstreak").textContent = stats.maxStreak;

  renderDistribution(stats.distribution, won ? guessCount - 1 : -1);

  // Re-wire share button with current game's won/guessCount
  const shareBtn = document.getElementById("share-btn");
  const newShareBtn = shareBtn.cloneNode(true); // remove old listeners
  shareBtn.parentNode.replaceChild(newShareBtn, shareBtn);
  newShareBtn.addEventListener("click", () => shareResults(won, guessCount));

  document.getElementById("modal-overlay").classList.add("visible");
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("visible");
}

function renderDistribution(dist, highlightIndex) {
  const container = document.getElementById("modal-dist");
  // Remove old bars, keep the h3
  container.querySelectorAll(".dist-row").forEach(el => el.remove());

  const max = Math.max(...dist, 1);
  dist.forEach((count, i) => {
    const row = document.createElement("div");
    row.className = "dist-row";

    const label = document.createElement("div");
    label.className = "dist-label";
    label.textContent = i + 1;

    const wrap = document.createElement("div");
    wrap.className = "dist-bar-wrap";

    const bar = document.createElement("div");
    bar.className = "dist-bar" + (i === highlightIndex ? " highlight" : "");
    // Animate width from 0 to target
    const pct = Math.max(7, Math.round((count / max) * 100));
    bar.style.width = "7%";
    bar.textContent = count;

    wrap.appendChild(bar);
    row.appendChild(label);
    row.appendChild(wrap);
    container.appendChild(row);

    // Trigger width animation after paint
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bar.style.width = pct + "%";
    }));
  });
}

// Close modal on overlay click (outside the box)
document.getElementById("modal-overlay").addEventListener("click", e => {
  if (e.target === document.getElementById("modal-overlay")) closeModal();
});

document.getElementById("play-again-btn").addEventListener("click", initGame);

// ─── Animations / helpers ─────────────────────────────────────────────────────
function shakeRow(r) {
  document.getElementById(`row-${r}`).querySelectorAll(".tile").forEach(t => {
    t.classList.remove("shake");
    void t.offsetWidth;
    t.classList.add("shake");
  });
}

function bounceRow(r) {
  document.getElementById(`row-${r}`).querySelectorAll(".tile").forEach((t, i) => {
    setTimeout(() => {
      t.classList.add("bounce");
      setTimeout(() => t.classList.remove("bounce"), 600);
    }, i * 100);
  });
}

function showToast(msg, duration = 1800) {
  const container = document.getElementById("toast-container");
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.textContent = msg;
  toast.style.animationDuration = duration + "ms";
  container.appendChild(toast);
  setTimeout(() => toast.remove(), duration);
}

// ─── Share ────────────────────────────────────────────────────────────────────
function buildShareText(won, guessCount) {
  const cb = document.documentElement.classList.contains("colorblind");
  const SQ = {
    correct: cb ? "\uD83D\uDFE7" : "\uD83D\uDFE9",  // 🟧 or 🟩
    present: cb ? "\uD83D\uDFE6" : "\uD83D\uDFE8",  // 🟦 or 🟨
    absent:  "\u2B1B"                                // ⬛
  };
  const header = `Wordle ${won ? guessCount : "X"}/6`;
  const grid   = results.map(row => row.map(s => SQ[s]).join("")).join("\n");
  return `${header}\n\n${grid}`;
}

function shareResults(won, guessCount) {
  const text = buildShareText(won, guessCount);
  const btn  = document.getElementById("share-btn");

  const markCopied = () => {
    btn.classList.add("copied");
    btn.querySelector("span").textContent = "Copied!";
    showToast("Copied to clipboard!");
    setTimeout(() => {
      btn.classList.remove("copied");
      btn.querySelector("span").textContent = "Share";
    }, 2000);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(markCopied).catch(() => fallbackCopy(text, markCopied));
  } else {
    fallbackCopy(text, markCopied);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;opacity:0;pointer-events:none";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); cb(); } catch (_) { showToast("Copy failed"); }
  document.body.removeChild(ta);
}

// ─── Theme (light/dark) ───────────────────────────────────────────────────────
const THEME_KEY = "wordle_theme";

(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  // Default: dark. Apply light only if explicitly saved.
  const light = saved === "light";
  applyTheme(light);

  document.getElementById("theme-toggle").addEventListener("click", () => {
    const isLight = document.documentElement.classList.contains("light");
    applyTheme(!isLight);
    try { localStorage.setItem(THEME_KEY, !isLight ? "light" : "dark"); } catch (_) {}
  });
})();

function applyTheme(light) {
  document.documentElement.classList.toggle("light", light);
  document.getElementById("icon-sun").style.display  = light ? "none"  : "";
  document.getElementById("icon-moon").style.display = light ? ""      : "none";
}

// ─── Color-blind mode ─────────────────────────────────────────────────────────
const CB_KEY = "wordle_colorblind";

function applyColorblind(on) {
  document.documentElement.classList.toggle("colorblind", on);
  document.getElementById("cb-toggle").classList.toggle("active", on);
}

(function initColorblind() {
  const saved = localStorage.getItem(CB_KEY) === "1";
  applyColorblind(saved);
  document.getElementById("cb-toggle").addEventListener("click", () => {
    const next = !document.documentElement.classList.contains("colorblind");
    applyColorblind(next);
    try { localStorage.setItem(CB_KEY, next ? "1" : "0"); } catch (_) {}
  });
})();

// ─── Start ────────────────────────────────────────────────────────────────────
initGame();
</script>
